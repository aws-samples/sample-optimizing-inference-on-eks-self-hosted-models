[project]
name = "demo-bench"
version = "0.1.0"
description = "Benchmark tooling for the KubeCon NA 2026 Dynamo on EKS demo (sizing, traces, metrics, reset, analysis)."
requires-python = ">=3.11"
authors = [{ name = "Amazon Web Services" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime is stdlib-only on purpose: the bench image already carries aiperf and its stack.
dependencies = []

[project.optional-dependencies]
# `demo-bench plot ...` only (imported lazily; the core never imports it).
plot = ["matplotlib==3.11.2"]

[project.scripts]
demo-bench = "demo_bench.cli:main"

[dependency-groups]
dev = [
    # The XML parser of tests/lib_xml.py; same pin as tests/requirements-test.txt.
    "defusedxml==0.7.1",
    "hypothesis==6.170.1",
    # Same pin as the `plot` extra, so mypy --strict and the plot tests see the real types.
    "matplotlib==3.11.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "S", "PL", "D", "ANN",
    "BLE", "TRY", "RET", "PTH", "ERA", "LOG", "G",
]
ignore = [
    "PLR0913",  # explicit keyword-only signatures mirror the CLI flags and the test contract
    "TRY003",   # contextual messages on ValueError are part of the contract (tests match them)
    "TRY004",   # malformed input files raise ValueError by contract, also for wrong JSON types
    "ANN401",   # JSON bodies and HTTP payloads are genuinely untyped (``Any``) at the boundary
    "S311",     # ``random`` drives seeded simulations/bootstraps, never security decisions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# qa-owned tests: asserts, magic numbers, local imports (RED-phase contract) and long lines are
# intentional there; the test files are not edited by the developer.
# Optional dependency (plot extra): matplotlib is imported lazily, inside the functions.
"src/demo_bench/infrastructure/sweep_charts.py" = ["PLC0415"]
# qa-owned file: an unused import and a noqa for a rule ruff does not enable (reported to qa).
"tests/unit/test_plot_sweep.py" = ["F401", "RUF100"]
"tests/**" = [
    "S101", "S311", "S603", "PLR2004", "PLC0415", "PLR0912", "D", "ANN", "E501", "PT011", "PT018",
    "RUF007",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["demo_bench"]
warn_unreachable = true
