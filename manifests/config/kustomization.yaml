# Platform config component (Track Q, Qwen3.8 on B200): platform.env, generated by scripts/gen_env.py from the
# terraform/cluster outputs (reference copy: platform.env.example), becomes a local-config ConfigMap that feeds the
# `replacements` (images, bucket, region) of the overlays that list this component, and is dropped from the
# rendered output (nothing extra is applied).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: platform-config
    envs:
      - platform.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
