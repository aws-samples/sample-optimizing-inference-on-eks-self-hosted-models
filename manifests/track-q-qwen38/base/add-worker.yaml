# Appends the aggregated Worker (components[1]): 8 pods x 1 engine TP1 on the 8 B200 GPUs = 8 router targets.
# The engine core is the CORE_ARGS of the renderer of the recorded runs (driver v2), verbatim and in its
# order, and is the SAME in every cell: the knobs only append to it
# (components/hicache-*: HiCache flags/env/L3; components/pd-efa: PD role flags + LIBFABRIC/EFA plumbing).
#   * weights from the prefetched HF cache on the node NVMe (hostPath, offline); the weights-gate waits for the
#     .done marker of the pinned revision (scripts/11-prefetch.sh, the config model). The revision literal must
#     equal MODEL_REVISION of manifests/config, which the scripts check the marker against;
#   * --kv-events-config (zmq, tcp://*:5557) so DYN_ROUTER_MODE=kv can route; --engine-route flush_cache:tm so
#     the matrix driver (tools/matrix_driver) can reset every engine;
#   * DYN_FORWARDPASS_METRIC_PORT="" (the forward-pass metric port is disabled on the derived image);
#   * memory 64Gi/128Gi (memory class "plain" of the recorded runs); the images are placeholders, kustomization.yaml sets RUNTIME_IMAGE.
# The components patch components[1] by index (args/-, env/-, volumeMounts/-, volumes/- = volumes[3]).
- op: add
  path: /spec/components/-
  value:
    name: Worker
    type: worker
    replicas: 8
    runtimeVersionOverride: "1.6.0"
    sharedMemorySize: 16Gi
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: qwen38-matrix
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        nodeSelector:
          karpenter.sh/nodepool: gpu-b200-cb
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: models
            hostPath:
              path: /mnt/.ephemeral/models
              type: Directory
          - name: ephemeral
            hostPath:
              path: /mnt/.ephemeral
              type: Directory
          - name: compile-cache
            emptyDir: {}
        initContainers:
          # Refuse to start unless /mnt/.ephemeral is the instance store, then wait (bounded) for the prefetch
          # marker of the pinned Qwen3.8 revision.
          - name: weights-gate
            image: track-q-image-placeholder
            imagePullPolicy: IfNotPresent
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -euo pipefail
                root=/mnt/.ephemeral
                marker="$root/models/hub/models--Qwen--Qwen3.8-27B-FP8/.done"
                dev=$(df -P "$root" | awk 'NR==2 {print $1}')
                size_gib=$(( $(df -Pk "$root" | awk 'NR==2 {print $2}') / 1048576 ))
                echo "ephemeral device=$dev size=${size_gib}GiB"
                if [ "$size_gib" -lt "$EPHEMERAL_MIN_GIB" ]; then
                  echo "FATAL: $root (${size_gib}GiB) is not the instance store" >&2
                  exit 1
                fi
                deadline=$(( $(date +%s) + WEIGHTS_WAIT_TIMEOUT_S ))
                until grep -qx "revision=$MODEL_REVISION" "$marker" 2>/dev/null; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "FATAL: no marker $marker for revision $MODEL_REVISION after ${WEIGHTS_WAIT_TIMEOUT_S}s" >&2
                    exit 1
                  fi
                  echo "waiting for $marker"
                  sleep 15
                done
                echo "weights ready: $(tr '\n' ' ' < "$marker")"
            env:
              - name: MODEL_REVISION
                value: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
              - name: EPHEMERAL_MIN_GIB
                value: "10000"
              - name: WEIGHTS_WAIT_TIMEOUT_S
                value: "1800"
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            volumeMounts:
              - name: ephemeral
                mountPath: /mnt/.ephemeral
                readOnly: true
        containers:
          - name: main
            image: track-q-image-placeholder
            imagePullPolicy: IfNotPresent
            command:
              - /bin/bash
              - -c
            # The body execs dynamo.sglang with the flags listed after "$0", so components can append flags
            # (JSON6902 add args/-) and every flag stays visible to tooling.
            args:
              - |
                set -euo pipefail
                ulimit -l unlimited || true
                ulimit -n 1048576 || true
                exec python3 -m dynamo.sglang "$@"
              - dynamo.sglang
              - --model-path
              - Qwen/Qwen3.8-27B-FP8
              - --revision
              - 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
              - --served-model-name
              - Qwen/Qwen3.8-27B-FP8
              - --tp-size
              - "1"
              - --page-size
              - "64"
              - --kv-cache-dtype
              - fp8_e4m3
              - --mem-fraction-static
              - "0.85"
              - --context-length
              - "131072"
              - --attention-backend
              - trtllm_mha
              - --mamba-radix-cache-strategy
              - extra_buffer
              - --enable-metrics
              - --kv-events-config
              - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
              - --host
              - 0.0.0.0
              - --engine-route
              - flush_cache:tm
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: HF_HUB_CACHE
                value: /models/hub
              - name: HF_HOME
                value: /compile-cache/hf-home
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: DYN_FORWARDPASS_METRIC_PORT
                value: ""
              - name: DYN_SGL_ALLOW_TOP_LOGPROBS
                value: "1"
              # Kernel caches in the pod's own emptyDir (never shared with another model or pod).
              - name: XDG_CACHE_HOME
                value: /compile-cache/xdg
              - name: TRITON_CACHE_DIR
                value: /compile-cache/triton
              - name: TORCHINDUCTOR_CACHE_DIR
                value: /compile-cache/inductor
              - name: FLASHINFER_WORKSPACE_BASE
                value: /compile-cache/flashinfer
              - name: SGLANG_CACHE_DIR
                value: /compile-cache/sglang
            ports:
              - name: system
                containerPort: 9090
            startupProbe:
              httpGet:
                path: /live
                port: system
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 240
            livenessProbe:
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
              failureThreshold: 60
            resources:
              requests:
                cpu: "16"
                memory: 64Gi
                nvidia.com/gpu: "1"
              limits:
                memory: 128Gi
                nvidia.com/gpu: "1"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RESOURCE
            volumeMounts:
              - name: models
                mountPath: /models
                readOnly: true
              - name: compile-cache
                mountPath: /compile-cache
            workingDir: /workspace
