# T-agg-hic (S2/S4): T-agg + HiCache L2 200 GB/engine + L3 NIXL POSIX (buffered) on every Worker, each pod in its
# own subdirectory of /mnt/.ephemeral/hicache-l3/qwen38-matrix/s-agg-hic (wiped by the matrix driver before each run).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: s-agg-hic
resources:
  - ../../base
components:
  - ../../components/hicache-agg
patches:
  - target:
      group: nvidia.com
      version: v1beta1
      kind: DynamoGraphDeployment
      name: q38
    patch: |-
      - op: test
        path: /spec/components/1/podTemplate/spec/volumes/3/name
        value: hicache-l3
      - op: replace
        path: /spec/components/1/podTemplate/spec/volumes/3/hostPath/path
        value: /mnt/.ephemeral/hicache-l3/qwen38-matrix/s-agg-hic
